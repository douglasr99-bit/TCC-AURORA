spring.application.name=aurora

# Variáveis de ambiente: AURORA_DB_URL, AURORA_DB_USUARIO, AURORA_DB_SENHA,
# AURORA_ADMIN_LOGIN, AURORA_ADMIN_SENHA, AURORA_KEYSTORE, AURORA_KEYSTORE_SENHA
# (e, opcionais, AURORA_HTTPS e AURORA_PORTA). Em desenvolvimento podem vir de um
# arquivo .env na pasta do projeto (fora do git).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${AURORA_DB_URL}
spring.datasource.username=${AURORA_DB_USUARIO}
spring.datasource.password=${AURORA_DB_SENHA}

# O esquema vem do schema.sql; o Hibernate só confere.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Nunca expor detalhes internos ao cliente.
server.error.include-stacktrace=never
server.error.include-message=never

# HTTPS (RNF09): ligado por padrão, porta 8443, certificado próprio em keystore PKCS12.
# Só em desenvolvimento se usa AURORA_HTTPS=false (e AURORA_PORTA=8080).
server.port=${AURORA_PORTA:8443}
server.ssl.enabled=${AURORA_HTTPS:true}
server.ssl.key-store=${AURORA_KEYSTORE:}
server.ssl.key-store-password=${AURORA_KEYSTORE_SENHA:}
server.ssl.key-store-type=PKCS12

# Sessão
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${AURORA_HTTPS:true}
