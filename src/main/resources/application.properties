spring.application.name=aurora

# Variáveis de ambiente: AURORA_DB_URL, AURORA_DB_USUARIO, AURORA_DB_SENHA,
# AURORA_ADMIN_LOGIN, AURORA_ADMIN_SENHA. Em desenvolvimento podem vir de um
# arquivo .env na pasta do projeto (fora do git).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${AURORA_DB_URL}
spring.datasource.username=${AURORA_DB_USUARIO}
spring.datasource.password=${AURORA_DB_SENHA}

# O esquema vem do schema.sql; o Hibernate só confere.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Nunca expor detalhes internos ao cliente.
server.error.include-stacktrace=never
server.error.include-message=never

# Sessão
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
